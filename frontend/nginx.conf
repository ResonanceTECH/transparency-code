server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /docs { return 302 /docs/; }
    location = /swagger { return 302 /docs/; }
    location /docs/ { root /usr/share/nginx/html; try_files $uri $uri/ =404; }
    location /openapi.json { proxy_pass http://backend:8000; }
    location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
