# HTTPS-вариант для сервера: nip.io + Caddy + Let's Encrypt.
# Базовый compose не меняется, локальный `docker compose up` остается по http.
#
# Автодеплой из main сам прописывает HTTP_PORT=8080 в .env и запускает оба файла.
# На сервере должны быть открыты входящие порты 80 и 443.
# Для ручного запуска на сервере:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
# Если HTTP_PORT задан в .env, он должен отличаться от 80, порт 80 занят Caddy.
# После старта сайт доступен по https://135.106.155.218.nip.io
services:
  backend:
    environment:
      # За TLS-прокси сессионная cookie снова несет флаг Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-135.106.155.218.nip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
