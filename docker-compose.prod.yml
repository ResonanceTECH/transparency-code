# Production-вариант: готовые образы из GHCR (собираются .github/workflows/cd.yml
# при каждом push в main) + Watchtower, который опрашивает реестр и сам
# перезапускает обновлённые контейнеры.
#
# Запуск на сервере:
#   cp .env.example .env   # заполнить POSTGRES_PASSWORD, SECRET_KEY
#   docker compose -f docker-compose.prod.yml up -d
#
# Если пакеты GHCR приватные — также задать GHCR_USER и GHCR_TOKEN в .env
# (токен: GitHub PAT со scope read:packages).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resonance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: resonance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonance -d resonance"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    image: ghcr.io/resonancetech/transparency-code-backend:latest
    build: ./backend
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    environment:
      DATABASE_URL: postgresql+asyncpg://resonance:${POSTGRES_PASSWORD}@db:5432/resonance
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      ENVIRONMENT: production
      ALLOW_DEMO_LOGIN: "true"
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    image: ghcr.io/resonancetech/transparency-code-frontend:latest
    build: ./frontend
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Обновлять только контейнеры с меткой watchtower.enable (не трогает db и чужие контейнеры)
      WATCHTOWER_LABEL_ENABLE: "true"
      # Опрос реестра, сек
      WATCHTOWER_POLL_INTERVAL: "60"
      # Удалять старые образы после обновления
      WATCHTOWER_CLEANUP: "true"
      # Перезапускать остановленные контейнеры, если появился свежий образ
      WATCHTOWER_REVIVE_STOPPED: "true"
      # Авторизация в GHCR — нужна только для приватных пакетов
      REPO_USER: ${GHCR_USER:-}
      REPO_PASS: ${GHCR_TOKEN:-}

volumes:
  pgdata:
  uploads:
