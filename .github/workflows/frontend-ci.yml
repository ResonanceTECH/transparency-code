name: frontend-ci

on:
  push:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # UI-прогон (test:prototype) отключён: сценарии описывают интерфейс,
      # заменённый единым UI профиля (DARIA-HANDOFF.md — адаптация UI-тестов
      # отдельным этапом). Вернуть playwright install + test:prototype после
      # переписывания спецификаций под актуальные экраны.
