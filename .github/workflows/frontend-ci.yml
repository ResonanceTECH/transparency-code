name: frontend-ci

on:
  push:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Playwright-наборы поднимают изолированный backend на SQLite (tools/test-stack.mjs).
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
        working-directory: backend
      - run: uv venv --python 3.12 .venv
        working-directory: backend
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
        working-directory: backend
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:prototype
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-prototype-results
          path: frontend/test-results
          retention-days: 14
          if-no-files-found: ignore
