name: e2e

# Автозапуск отключён: flow.spec.ts описывает интерфейс, удалённый при переходе
# на единый UI финансового профиля (DARIA-HANDOFF.md — адаптация UI-сценариев
# отдельным этапом). Оставлен ручной запуск; вернуть триггеры push/PR после
# переписывания тестов под актуальные экраны.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-only-password
      SECRET_KEY: ci-only-secret-key
      HTTP_PORT: '8080'
    steps:
      - uses: actions/checkout@v4

      - name: Start docker compose stack
        run: docker compose up -d --build --wait

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run integration tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs --tail=200 backend db

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: frontend/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down stack
        if: always()
        run: docker compose down -v
